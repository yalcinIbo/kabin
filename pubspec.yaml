name: kabin
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cached_network_image: ^4.0.2
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  crypto: ^3.0.7
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_3d_controller: ^2.3.0
  flutter_image_compress: ^2.5.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.2.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

# flutter_3d_controller'ın getirdiği flutter_inappwebview_android 1.1.3, yeni Android Gradle eklentisinde derlenmiyor
# (getDefaultProguardFile('proguard-android.txt') kaldırıldı). Düzeltme 6.2.0 beta serisinde; kararlı sürüm çıkınca kaldır.
dependency_overrides:
  flutter_inappwebview: 6.2.0-beta.3
